# Render blueprint — https://render.com/docs/blueprint-spec
# Connect the repo on Render and "New + → Blueprint" provisions the web
# service AND the Postgres database, with DATABASE_URL wired automatically.
#
# The web service is stateless: tasks live in the Postgres database below
# (DATABASE_URL is injected automatically), so data survives redeploys and
# restarts even on free plans. The schema is provisioned automatically on
# first use — no manual psql step needed.

databases:
  - name: quickcapture-db
    databaseName: quickcapture
    plan: free

services:
  - type: web
    name: quickcapture
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # CI-only changes (workflow files) should not consume free-tier build
    # minutes or trigger deploys.
    buildFilter:
      ignoredPaths:
        - ".github/**"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quickcapture-db
          property: connectionString
      - key: QUICKCAPTURE_DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
