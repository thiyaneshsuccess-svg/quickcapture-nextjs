# Render blueprint — https://render.com/docs/blueprint-spec
# Connect the repo on Render and "New + → Blueprint" provisions this service.
# NOTE: the free web tier has no persistent disks and sleeps after ~15 min
# idle (tasks reset on wake/redeploy). For durable storage move to a paid
# disk or swap lib/tasks/store.ts for the Supabase/Postgres store.
services:
  - type: web
    name: quickcapture
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # CI-only changes (workflow files) should not consume free-tier build
    # minutes or trigger deploys.
    buildFilter:
      ignoredPaths:
        - ".github/**"
    envVars:
      - key: QUICKCAPTURE_DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
